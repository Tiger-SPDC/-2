# 来源信任等级与评分权重（参考 docs/00_MASTER_PLAN.md §8.1、§15.2）

source_grades:
  A: 政府、监管、官方统计、正式法规；核心事实优先
  B: 上市公司公告、财报、公司正式新闻稿；企业一手事实，注意自述偏差
  C: 一般媒体、专业垂直网站；主要用于线索发现
  D: 自媒体、论坛、社交内容；只作为线索，不直接支持关键事实
  E: 无法识别来源或二次转述；默认排除或低权重
  F: 模型推断/估算；只能作为推断，绝不能伪装成事实

# 内部算法权重（0-100 总分，仅作算法权重，不作对外官方评级）
score_weights:
  authority: 30
  firsthand: 25
  cross_validation: 20
  data_definition: 15
  time_relevance: 10
