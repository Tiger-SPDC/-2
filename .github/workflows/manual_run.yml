name: Manual Run

# 手动触发完整链路（workflow_dispatch）。
# 输入在程序层校验（main.py --validate 语义），不在 workflow 层写死业务规则。
# 覆盖参数以逗号分隔（不加空格），例如：中国,德国

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 任务 id（config/tasks/<id>.yaml，程序层校验）
        required: true
        type: string
        default: charging_cn_weekly
      topic_id:
        description: Topic id（可选；缺省读取任务配置）
        required: false
        type: string
      days:
        description: 时间窗口（天）
        required: false
        type: number
      regions:
        description: 覆盖地区（逗号分隔，不加空格）
        required: false
        type: string
      companies:
        description: 覆盖企业（逗号分隔，不加空格）
        required: false
        type: string
      focus:
        description: 覆盖核心词（逗号分隔，不加空格）
        required: false
        type: string
      depth:
        description: 采集深度
        required: false
        type: choice
        options: [standard, quick, deep]
        default: standard
      notify:
        description: 推送微信摘要
        required: false
        type: boolean
        default: true
      force:
        description: 忽略上次运行记录（同一天已运行过时使用）
        required: false
        type: boolean
        default: false

concurrency:
  group: industry-intelligence-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Run full pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TZ: Asia/Shanghai
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_TOPIC_ID: ${{ inputs.topic_id }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_REGIONS: ${{ inputs.regions }}
          INPUT_COMPANIES: ${{ inputs.companies }}
          INPUT_FOCUS: ${{ inputs.focus }}
          INPUT_DEPTH: ${{ inputs.depth }}
          INPUT_NOTIFY: ${{ inputs.notify }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_TASK_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Invalid task_id: use letters, numbers, underscore, or hyphen only" >&2
            exit 2
          fi
          TOPIC="$INPUT_TOPIC_ID"
          if [ -z "$TOPIC" ]; then
            TOPIC="$(python - <<'PY'
          import pathlib
          import os

          import yaml

          task_id = os.environ["INPUT_TASK_ID"]
          task_path = pathlib.Path("config/tasks") / f"{task_id}.yaml"
          data = yaml.safe_load(task_path.read_text(encoding="utf-8"))
          print(data["task"]["topic_id"])
          PY
            )"
          fi
          ARGS=(--topic "$TOPIC" --task "$INPUT_TASK_ID" --phase2 --phase3 --phase4)
          ARGS+=(--output data/collection.jsonl --db-path data/state/industry_intelligence.sqlite)
          if [ -n "$INPUT_DAYS" ]; then ARGS+=(--days "$INPUT_DAYS"); fi
          if [ -n "$INPUT_REGIONS" ]; then ARGS+=(--regions "$INPUT_REGIONS"); fi
          if [ -n "$INPUT_COMPANIES" ]; then ARGS+=(--companies "$INPUT_COMPANIES"); fi
          if [ -n "$INPUT_FOCUS" ]; then ARGS+=(--focus "$INPUT_FOCUS"); fi
          ARGS+=(--depth "$INPUT_DEPTH" --notify "$INPUT_NOTIFY")
          python main.py "${ARGS[@]}"

      - name: Commit data and reports
        run: |
          git config user.name "industry-intelligence-agent[bot]"
          git config user.email "agent[bot]@users.noreply.github.com"
          git add data/state/industry_intelligence.sqlite data/collection.jsonl data/push_log.jsonl output/reports 2>/dev/null || true
          if [ -f data/state/scheduler_state.json ]; then git add data/state/scheduler_state.json; fi
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(data): manual run outputs"
            git push
          fi

      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-reports-${{ github.run_id }}
          path: |
            output/reports/
            data/state/scheduler_state.json
          retention-days: 30

      - name: Notify failure
        if: failure()
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python scripts/notify_failure.py
