# WebSearch 配置 fixture（load_websearch_config 单元测试用）
websearch:
  enabled: true
  engines:
    - id: bing
      base_urls:
        - https://cn.bing.com/search
        - https://www.bing.com/search
      params:
        mkt: zh-CN
        setlang: zh-hans
      max_results: 20
      delay_seconds: 2.0
      user_agent: "Mozilla/5.0 (test)"
      enabled: true
