# 系统级配置（与行业无关）
# 参考：docs/00_MASTER_PLAN.md §5.1

system:
  timezone: Asia/Shanghai
  default_language: zh-CN

collection:
  max_concurrency: 5
  request_timeout_seconds: 20
  retries: 2
  user_agent: industry-intelligence-agent
  polite_delay_seconds: 1.5

storage:
  persistent_format: jsonl
  save_raw_html: false
  save_text_snapshot: true

quality:
  require_evidence_for_key_claim: true
  reject_untraceable_numbers: true

# LLM 接入（Phase 2 启用；API Key 通过环境变量注入，不落库）
llm:
  provider: deepseek
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com/v1
  temperature: 0.1
  max_tokens: 4096

# 竞争情报分析（Phase 3 启用）
# enabled_dimensions：启用维度；comparison_windows：历史比较窗口（周）
# confidence_threshold：关键 Claim 置信度门槛
analysis:
  enabled_dimensions: [competitor, market, technology, risk]
  comparison_windows: [1, 4, 12, 52]
  confidence_threshold: 0.5

# 报告生成开关（Phase 4 启用）
report:
  markdown: true
  excel: true
  wechat_digest: true

# 质量审查（Phase 4 启用）
# enabled：是否运行 Review Agent（7 项检查：数字可追溯/日期/推断≠事实/活动度≠销量/证据/矛盾/措辞）
review:
  enabled: true

# 通知推送（Phase 4 启用）
# serverchan_key_env：Server酱 SendKey 所在的环境变量名（Secret 不落库、不提交 Git）
notification:
  serverchan_key_env: SERVERCHAN_KEY
  retry: 2
  timeout_seconds: 10
